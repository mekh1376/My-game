<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گردونه شانس طلایی</title>
    <!-- اسکریپت تلگرام برای دریافت اطلاعات کاربر -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 15px;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        h1 { font-size: 22px; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); margin-bottom: 5px; }
        .coins-box { background: rgba(0, 0, 0, 0.3); display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 16px; margin-top: 10px; color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); }
        .wheel-container { position: relative; margin: 25px auto; width: 270px; height: 270px; }
        .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 25px solid #ff4757; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        #wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.4); transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99); }
        button { background: linear-gradient(45deg, #2ed573, #26af5f); color: #fff; border: none; padding: 14px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4); transition: 0.3s; margin-top: 10px; width: 100%; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #57606f; box-shadow: none; cursor: not-allowed; }
        .result { margin-top: 15px; font-size: 16px; font-weight: bold; min-height: 24px; color: #2ed573; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ گردونه شانس طلایی ✨</h1>
        <div class="coins-box">💰 موجودی: <span id="coinCount">0</span> سکه</div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="270" height="270"></canvas>
        </div>
        
        <button id="spinBtn" onclick="spin()">بچرخون!</button>
        <div class="result" id="resultText"></div>
    </div>

    <script>
        // آدرس گوگل شیت خود را در زیر قرار دهید
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOTR4Seq4weCerePZ3yBWCC4O0hU-2DVZepEPWWLfJjcjyYVw2-grjS1JvoPmMhfeM/exec';

        // دریافت اطلاعات کاربر از تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // باز کردن کامل صفحه
        
        const user = tg.initDataUnsafe?.user || { id: 'GUEST_' + Math.floor(Math.random()*1000), first_name: 'مهمان', username: 'guest' };

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        const items = [
            { text: '۲۰ سکه', val: 20 },
            { text: 'پوچ ❌', val: 0 },
            { text: '۵۰ سکه', val: 50 },
            { text: '۱۰ سکه', val: 10 },
            { text: '۱۰۰ سکه 🔥', val: 100 },
            { text: 'پوچ ❌', val: 0 },
            { text: '۲ برابر ⚡', val: '2x' },
            { text: '۵ سکه', val: 5 }
        ];
        
        const colors = ['#ff4757', '#2e86de', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#341f97', '#ff6b6b'];
        let currentRotation = 0;
        let isSpinning = false;
        
        let storedCoins = localStorage.getItem('user_coins');
        let coins = parseInt(storedCoins);
        if (isNaN(coins)) coins = 0;

        function updateCoinDisplay() {
            document.getElementById('coinCount').innerText = coins;
            localStorage.setItem('user_coins', coins.toString());
            sendDataToGoogleSheet();
        }
        updateCoinDisplay();

        function drawWheel() {
            const numSegments = items.length;
            const anglePerSegment = (2 * Math.PI) / numSegments;
            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(135, 135);
                ctx.arc(135, 135, 135, i * anglePerSegment, (i + 1) * anglePerSegment);
                ctx.fill();
                ctx.save();
                ctx.translate(135, 135);
                ctx.rotate(i * anglePerSegment + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px Tahoma";
                ctx.fillText(items[i].text, 115, 5);
                ctx.restore();
            }
        }
        drawWheel();

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultText').innerText = 'در حال چرخش... 🎲';

            const extraDegrees = Math.floor(Math.random() * 360) + 1440;
            currentRotation += extraDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                
                const actualDegrees = currentRotation % 360;
                const segmentAngle = 360 / items.length;
                const index = Math.floor((360 - (actualDegrees % 360) + 270) % 360 / segmentAngle);
                const prize = items[index];

                document.getElementById('resultText').innerText = `🎉 برنده شدید: ${prize.text}`;

                if (typeof prize.val === 'number') {
                    coins += prize.val;
                } else if (prize.val === '2x') {
                    coins = coins > 0 ? coins * 2 : 20;
                }
                
                updateCoinDisplay();
            }, 4000);
        }

        // ارسال اطلاعات به گوگل شیت
        function sendDataToGoogleSheet() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('آدرس_لینک')) return;

            const payload = {
                userId: user.id,
                name: user.first_name || 'بدون نام',
                username: user.username || 'ندارد',
                coins: coins
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('Error sending to sheet:', err));
        }
    </script>
</body>
</html>
