<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گردونه شانس طلایی</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body {
            background-color: #121824; color: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 15px;
        }
        .container {
            width: 100%; max-width: 380px; background: #1b2735; border: 1px solid #334155;
            padding: 20px 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative;
        }
        .top-btns { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%; border: none; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-crown { background: #f1c40f; }
        .btn-winners { background: #a855f7; }
        
        h1 { font-size: 18px; color: #f1c40f; margin-bottom: 5px; }
        .user-badge { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
        .info-panel {
            display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 10px;
        }
        .info-title { font-size: 11px; color: #94a3b8; }
        .info-value { font-size: 15px; font-weight: bold; color: #f1c40f; }
        .timer-box {
            font-size: 12px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 8px; border-radius: 8px; margin-bottom: 10px; display: none;
        }
        .wheel-container { position: relative; margin: 15px auto; width: 250px; height: 250px; }
        .pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #ef4444; z-index: 10;
        }
        #wheel { width: 250px; height: 250px; border-radius: 50%; border: 4px solid #f1c40f; transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99); }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button.action-btn { color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; }
        .btn-spin { background: #22c55e; }
        .btn-invite { background: #0284c7; }
        .btn-buy { background: #f97316; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result { margin-top: 10px; font-size: 14px; font-weight: bold; min-height: 20px; color: #4ade80; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; border-radius: 15px; padding: 20px; width: 90%; max-width: 340px; text-align: center; max-height: 80vh; overflow-y: auto; }
        .package-item { background: #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #334155; border-radius: 6px; margin-bottom: 6px; font-size: 12px; text-align: right; }
        .rank-num { font-weight: bold; color: #f1c40f; width: 25px; }
        .winner-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; text-align: right; font-size: 12px; }
        .winner-title { color: #f1c40f; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #334155; padding-bottom: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-btns">
            <button class="icon-btn btn-crown" onclick="openLeaderboard()" title="برترین‌های هفته">👑</button>
            <button class="icon-btn btn-winners" onclick="openWinnersHistory()" title="تاریخچه برندگان">🎁</button>
        </div>
        
        <h1>گردونه شانس طلایی</h1>
        <div id="userBadge" class="user-badge">شناسه: ---</div>

        <div class="info-panel">
            <div><div class="info-title">موجودی این هفته</div><div class="info-value"><span id="coins">0</span> سکه</div></div>
            <div><div class="info-title">شانس باقی‌مانده</div><div class="info-value"><span id="spins">0</span> بار</div></div>
        </div>

        <div id="timerBox" class="timer-box">دریافت ۲ شانس جدید در: <span id="countdown">--:--:--</span></div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="250" height="250"></canvas>
        </div>

        <div id="resultText" class="result"></div>

        <div class="btn-group">
            <button id="spinBtn" class="action-btn btn-spin" onclick="spin()">بچرخون! 🎲</button>
            <button class="action-btn btn-invite" onclick="shareInvite()">👥 دعوت از دوستان (+۲ شانس)</button>
            <button class="action-btn btn-buy" onclick="openModal('buyModal')">🛒 خرید شانس بیشتر</button>
        </div>
    </div>

    <!-- خرید -->
    <div id="buyModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">انتخاب بسته شانس</h3>
            <div class="package-item" onclick="buyPackage('۳ شانس', '۱۵,۰۰۰ تومان')"><span>۳ شانس</span><span>۱۵,۰۰۰ تومان</span></div>
            <div class="package-item" onclick="buyPackage('۵ شانس', '۲۳,۰۰۰ تومان')"><span>۵ شانس</span><span>۲۳,۰۰۰ تومان</span></div>
            <div class="package-item" onclick="buyPackage('۱۰ شانس', '۴۲,۰۰۰ تومان')"><span>۱۰ شانس</span><span>۴۲,۰۰۰ تومان</span></div>
            <button class="action-btn" style="background:#ef4444; margin-top:10px;" onclick="closeModal('buyModal')">بستن</button>
        </div>
    </div>

    <!-- برترین‌های این هفته -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">👑 ۱۰ کاربر برتر این هفته</h3>
            <div id="leaderList">در حال دریافت...</div>
            <button class="action-btn" style="background:#ef4444; margin-top:10px;" onclick="closeModal('leaderboardModal')">بستن</button>
        </div>
    </div>

    <!-- تاریخچه برندگان هفته‌های قبل -->
    <div id="winnersModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">🎁 برندگان هفته‌های گذشته</h3>
            <div id="winnersList">در حال دریافت...</div>
            <button class="action-btn" style="background:#ef4444; margin-top:10px;" onclick="closeModal('winnersModal')">بستن</button>
        </div>
    </div>

    <script>
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycby54tOaKv8Fu1DiyLD66wuCtXRKgBoChREogCCmQEooNxeXNNXroGXa0XeWAqo6jLl_pg/exec';
        const BOT_USER = 'LuckiyiyBot';
        const SUPPORT_USER = 'luckiy_support';

        let userId = 'GUEST_' + Math.floor(1000 + Math.random() * 9000);
        let userName = 'مهمان';
        let userUsername = 'guest';

        try {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                const u = window.Telegram.WebApp.initDataUnsafe.user;
                userId = 'TG_' + u.id;
                userName = (u.first_name || '') + ' ' + (u.last_name || '');
                userUsername = u.username ? '@' + u.username : 'ندارد';
            }
        } catch(e){}

        document.getElementById('userBadge').innerText = 'کاربر: ' + userName;

        let coins = parseInt(localStorage.getItem('c_' + userId)) || 0;
        let spins = localStorage.getItem('s_' + userId) !== null ? parseInt(localStorage.getItem('s_' + userId)) : 5;
        let targetTime = parseInt(localStorage.getItem('t_' + userId)) || 0;

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('spins').innerText = spins;
            document.getElementById('spinBtn').disabled = spins <= 0;
        }

        function saveState() {
            localStorage.setItem('c_' + userId, coins);
            localStorage.setItem('s_' + userId, spins);
            localStorage.setItem('t_' + userId, targetTime);
            updateUI();
        }

        function loadUserDataFromSheet() {
            fetch(GOOGLE_URL + '?action=getUserData&userId=' + encodeURIComponent(userId))
                .then(r => r.json())
                .then(data => {
                    if (data && data.status === 'found') {
                        coins = parseInt(data.coins) || 0;
                        spins = parseInt(data.spins) || 0;
                        saveState();
                    } else if (data && data.status === 'not_found') {
                        coins = 0; spins = 5; targetTime = 0;
                        saveState();
                        syncSheet();
                    }
                }).catch(e => console.log(e));
        }
        loadUserDataFromSheet();

        function checkTimer() {
            const now = Date.now();
            if (spins === 0) {
                if (!targetTime || targetTime <= now) targetTime = now + (24 * 60 * 60 * 1000);
                const diff = targetTime - now;
                if (diff > 0) {
                    document.getElementById('timerBox').style.display = 'block';
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
                } else {
                    spins = 2; targetTime = 0;
                    document.getElementById('timerBox').style.display = 'none';
                    saveState();
                }
            } else { document.getElementById('timerBox').style.display = 'none'; }
            saveState();
        }
        setInterval(checkTimer, 1000);

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const items = ['۲۰ سکه', 'پوچ', '۵۰ سکه', '۱۰ سکه', '۱۰۰ سکه', 'پوچ', '۲ برابر', '۵ سکه'];
        const values = [20, 0, 50, 10, 100, 0, '2x', 5];
        const colors = ['#ef4444', '#3b82f6', '#a855f7', '#eab308', '#f97316', '#14b8a6', '#6366f1', '#ec4899'];

        function drawWheel() {
            const arc = (2 * Math.PI) / items.length;
            for (let i = 0; i < items.length; i++) {
                ctx.beginPath(); ctx.fillStyle = colors[i]; ctx.moveTo(125, 125);
                ctx.arc(125, 125, 125, i * arc, (i + 1) * arc); ctx.fill();
                ctx.save(); ctx.translate(125, 125); ctx.rotate(i * arc + arc / 2);
                ctx.fillStyle = "#fff"; ctx.font = "bold 12px Tahoma"; ctx.fillText(items[i], 50, 4);
                ctx.restore();
            }
        }
        drawWheel();

        let rotation = 0, spinning = false;

        function spin() {
            if (spinning || spins <= 0) return;
            spinning = true; spins--;
            if (spins === 0) targetTime = Date.now() + (24 * 60 * 60 * 1000);
            saveState();

            const deg = Math.floor(Math.random() * 360) + 1440;
            rotation += deg;
            canvas.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                spinning = false;
                const actualDeg = rotation % 360;
                const index = Math.floor((360 - (actualDeg % 360) + 270) % 360 / (360 / items.length));
                const val = values[index];

                if (typeof val === 'number') coins += val;
                else if (val === '2x') coins *= 2;

                document.getElementById('resultText').innerText = `نتیجه: ${items[index]}`;
                saveState(); syncSheet();
            }, 4000);
        }

        function syncSheet() {
            fetch(GOOGLE_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ userId, name: userName, username: userUsername, coins, spins })
            }).catch(e => console.log(e));
        }

        function openLeaderboard() {
            openModal('leaderboardModal');
            const listDiv = document.getElementById('leaderList');
            listDiv.innerHTML = 'در حال دریافت...';
            fetch(GOOGLE_URL + '?action=getLeaderboard')
                .then(r => r.json())
                .then(data => {
                    if (data && Array.isArray(data) && data.length > 0) {
                        data.sort((a, b) => (parseInt(b.coins) || 0) - (parseInt(a.coins) || 0));
                        let html = '';
                        data.slice(0, 10).forEach((u, i) => {
                            html += `<div class="list-item"><span class="rank-num">#${i + 1}</span><span>${u.name || 'کاربر'}</span><span style="color:#22c55e;font-weight:bold;">${u.coins || 0} سکه</span></div>`;
                        });
                        listDiv.innerHTML = html;
                    } else listDiv.innerHTML = 'هنوز کاربری ثبت نشده است.';
                }).catch(() => listDiv.innerHTML = 'خطا در دریافت اطلاعات.');
        }

        function openWinnersHistory() {
            openModal('winnersModal');
            const listDiv = document.getElementById('winnersList');
            listDiv.innerHTML = 'در حال دریافت...';
            fetch(GOOGLE_URL + '?action=getWinnersHistory')
                .then(r => r.json())
                .then(data => {
                    if (data && Array.isArray(data) && data.length > 0) {
                        let html = '';
                        data.forEach(w => {
                            html += `
                                <div class="winner-card">
                                    <div class="winner-title">📅 هفته: ${w.date}</div>
                                    <div>🥇 نفر اول (۱ میلیون): <b>${w.top1}</b></div>
                                    <div>🥈 نفر دوم (۵۰۰ هزار): <b>${w.top2}</b></div>
                                    <div>🥉 نفر سوم (۳۰۰ هزار): <b>${w.top3}</b></div>
                                    <div style="margin-top:5px; color:#38bdf8;">🎲 برندگان قرعه‌کشی (۵۰۰ هزار):</div>
                                    <div style="font-size:11px; padding-right:10px;">• ${w.lottery1}<br>• ${w.lottery2}<br>• ${w.lottery3}</div>
                                </div>
                            `;
                        });
                        listDiv.innerHTML = html;
                    } else listDiv.innerHTML = 'هنوز تاریخچه برنده‌ای ثبت نشده است.';
                }).catch(() => listDiv.innerHTML = 'خطا در دریافت تاریخچه.');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function shareInvite() {
            const txt = encodeURIComponent("بیا گردونه شانس رو بچرخون و سکه ببر! 🔥");
            window.open(`https://t.me/share/url?url=https://t.me/${BOT_USER}&text=${txt}`);
        }

        function buyPackage(p, pr) {
            closeModal('buyModal');
            const txt = encodeURIComponent(`درخواست خرید:\nنام: ${userName}\nآیدی: ${userId}\nبسته: ${p}\nقیمت: ${pr}`);
            window.open(`https://t.me/${SUPPORT_USER}?text=${txt}`);
        }
    </script>
</body>
</html>
