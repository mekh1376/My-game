<script>
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbwv6qV_Zm1TuieuRO1jmN_ygx_fpRYKijrnzGLuWMZrScs4qi313dsCJ0NRvtf7yOdE6Q/exec';
        const BOT_USER = 'LuckiyiyBot';
        const SUPPORT_USER = 'luckiy_support';

        let userId = '';
        let userName = 'کاربر مهمان';
        let userUsername = 'Guest';
        let coins = 0;
        let spins = 5;
        let targetTime = 0;
        let rotation = 0;
        let spinning = false;

        const items = ['۲۰ سکه', 'پوچ ❌', '۵۰ سکه', '۱۰ سکه', '۱۰۰ سکه', 'پوچ ❌', '۲ برابر ⚡', '۵ سکه'];
        const values = [20, 0, 50, 10, 100, 0, '2x', 5];
        const colors = ['#dc2626', '#1e293b', '#9333ea', '#ca8a04', '#ea580c', '#334155', '#4f46e5', '#db2777'];

        window.addEventListener('DOMContentLoaded', () => {
            initTelegramUser();
            loadLocalData();
            drawWheel();
            updateUI();
            checkTimer();
            setInterval(checkTimer, 1000);
            fetchUserDataJSONP();
        });

        function initTelegramUser() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                    const tgUser = window.Telegram.WebApp.initDataUnsafe ? window.Telegram.WebApp.initDataUnsafe.user : null;
                    if (tgUser && tgUser.id) {
                        userId = 'TG_' + tgUser.id;
                        const fName = tgUser.first_name ? tgUser.first_name.trim() : '';
                        const lName = tgUser.last_name ? tgUser.last_name.trim() : '';
                        userName = (fName + ' ' + lName).trim() || ('کاربر ' + tgUser.id);
                        userUsername = tgUser.username ? ('@' + tgUser.username) : userName;
                    }
                }
            } catch (e) { console.log(e); }

            if (!userId) {
                let savedId = localStorage.getItem('guest_id');
                if (!savedId) {
                    savedId = 'TG_' + Math.floor(100000 + Math.random() * 900000);
                    localStorage.setItem('guest_id', savedId);
                }
                userId = savedId;
                userName = 'کاربر ' + userId.replace('TG_', '');
            }

            const badge = document.getElementById('userBadge');
            if (badge) badge.innerText = 'کاربر: ' + userName;
        }

        function loadLocalData() {
            coins = parseInt(localStorage.getItem('c_' + userId)) || 0;
            spins = localStorage.getItem('s_' + userId) !== null ? parseInt(localStorage.getItem('s_' + userId)) : 5;
            targetTime = parseInt(localStorage.getItem('t_' + userId)) || 0;
        }

        function updateUI() {
            const cEl = document.getElementById('coins');
            const sEl = document.getElementById('spins');
            const btn = document.getElementById('spinBtn');
            if (cEl) cEl.innerText = coins;
            if (sEl) sEl.innerText = spins;
            if (btn) btn.disabled = spins <= 0;
        }

        function clearLeaderboardCache() {
            localStorage.removeItem('cache_leaderboard');
            localStorage.removeItem('cache_leaderboard_time');
        }

        function saveState() {
            localStorage.setItem('c_' + userId, coins);
            localStorage.setItem('s_' + userId, spins);
            localStorage.setItem('t_' + userId, targetTime);
            updateUI();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const numSegments = items.length;
            const arc = (2 * Math.PI) / numSegments;
            const centerX = 130, centerY = 130, radius = 130;

            ctx.clearRect(0, 0, 260, 260);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.fill();

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
                ctx.lineWidth = 2;
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius);
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Tahoma, Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 4;
                ctx.fillText(items[i], 75, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.fillStyle = '#fbbf24';
            ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function spin() {
            if (spinning || spins <= 0) return;
            spinning = true;
            spins--;
            
            // اگر شانس‌ها تمام شد، استارت تایمر ۲۴ ساعته واقعی
            if (spins === 0) {
                targetTime = Date.now() + (24 * 60 * 60 * 1000);
            }
            saveState();

            const deg = Math.floor(Math.random() * 360) + 1440;
            rotation += deg;
            const wheelEl = document.getElementById('wheel');
            if (wheelEl) wheelEl.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                spinning = false;
                const actualDeg = rotation % 360;
                const index = Math.floor((360 - (actualDeg % 360) + 270) % 360 / (360 / items.length));
                const val = values[index];

                if (typeof val === 'number') coins += val;
                else if (val === '2x') coins *= 2;

                const resText = document.getElementById('resultText');
                if (resText) resText.innerText = `نتیجه: ${items[index]}`;
                
                saveState();
                clearLeaderboardCache();
                syncSheet();
            }, 4000);
        }

        function fetchUserDataJSONP() {
            window.handleUserData = function(data) {
                if (data && data.status === 'found') {
                    coins = parseInt(data.coins) || 0;
                    spins = parseInt(data.spins) || 0;
                    saveState();
                } else {
                    syncSheet();
                }
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_URL}?action=getUserData&userId=${encodeURIComponent(userId)}&callback=handleUserData&_=` + Date.now();
            document.body.appendChild(script);
        }

        function syncSheet() {
            const url = `${GOOGLE_URL}?action=saveData&userId=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}&username=${encodeURIComponent(userUsername)}&coins=${coins}&spins=${spins}&_=${Date.now()}`;
            
            const script = document.createElement('script');
            script.src = url;
            document.body.appendChild(script);
            script.onload = () => script.remove();
        }

        // اصلاح کامل منطق تایمر ۲۴ ساعته
        function checkTimer() {
            const now = Date.now();
            const timerBox = document.getElementById('timerBox');
            
            if (spins === 0) {
                if (!targetTime || targetTime <= 0) {
                    targetTime = now + (24 * 60 * 60 * 1000);
                    saveState();
                }
                
                const diff = targetTime - now;
                if (diff > 0) {
                    if (timerBox) timerBox.style.display = 'block';
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    const countdown = document.getElementById('countdown');
                    if (countdown) countdown.innerText = `${h}:${m}:${s}`;
                } else {
                    // زمان به اتمام رسید: شارژ مجدد شانس‌ها
                    spins = 2; 
                    targetTime = 0;
                    if (timerBox) timerBox.style.display = 'none';
                    saveState();
                    syncSheet();
                }
            } else { 
                if (timerBox) timerBox.style.display = 'none'; 
            }
        }

        function openLeaderboard() {
            openModal('leaderboardModal');
            
            const cachedData = localStorage.getItem('cache_leaderboard');
            const cacheTime = localStorage.getItem('cache_leaderboard_time');
            const now = Date.now();

            if (cachedData && cacheTime && (now - cacheTime < 2 * 60 * 1000)) {
                renderLeaderboard(JSON.parse(cachedData));
                return;
            }

            const lList = document.getElementById('leaderList');
            if (lList) lList.innerHTML = 'در حال دریافت به‌روزترین رتبه‌بندی...';
            
            window.handleLeaderboard = function(data) {
                if (data && Array.isArray(data)) {
                    localStorage.setItem('cache_leaderboard', JSON.stringify(data));
                    localStorage.setItem('cache_leaderboard_time', Date.now());
                    renderLeaderboard(data);
                } else {
                    if (lList) lList.innerHTML = 'هنوز اطلاعاتی ثبت نشده است.';
                }
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_URL}?action=getLeaderboard&callback=handleLeaderboard&_=` + Date.now();
            document.body.appendChild(script);
        }

        // اصلاح مشکل تکرار نام کاربر در جدول برترین‌ها
        function renderLeaderboard(data) {
            const lList = document.getElementById('leaderList');
            if (!lList) return;

            if (!data || data.length === 0) {
                lList.innerHTML = 'اطلاعاتی یافت نشد.';
                return;
            }

            // به‌روزرسانی یا ادغام امن امتیاز کاربر جاری بدون تکرار نام در آرایه
            let userFoundInList = false;
            data.forEach(u => {
                if (u.name === userName || u.username === userUsername) {
                    u.coins = Math.max(parseInt(u.coins) || 0, coins);
                    userFoundInList = true;
                }
            });

            if (!userFoundInList && coins > 0) {
                data.push({ name: userName, username: userUsername, coins: coins });
            }

            // فیلتر کردن موارد تکراری احتمالی بر اساس نام یا نام کاربری
            const uniqueData = [];
            const seenNames = new Set();
            data.forEach(u => {
                const key = u.name || u.username;
                if (!seenNames.has(key)) {
                    seenNames.add(key);
                    uniqueData.push(u);
                }
            });

            uniqueData.sort((a, b) => (parseInt(b.coins) || 0) - (parseInt(a.coins) || 0));
            
            let html = '';
            uniqueData.slice(0, 10).forEach((u, i) => {
                const name = u.name && u.name !== 'کاربر مهمان' ? u.name : (u.username || 'کاربر');
                const isMe = (name === userName || u.username === userUsername);
                const highlightStyle = isMe ? 'style="background:rgba(251, 191, 36, 0.2); border:1px solid #fbbf24;"' : '';
                
                html += `<div class="list-item" ${highlightStyle}>
                            <span class="rank-num">#${i + 1}</span>
                            <span>${name} ${isMe ? ' (شما)' : ''}</span>
                            <span style="color:#4ade80;font-weight:bold;">${u.coins || 0} سکه</span>
                         </div>`;
            });
            lList.innerHTML = html;
        }

        function openWinnersHistory() {
            openModal('winnersModal');
            
            const cachedData = localStorage.getItem('cache_winners');
            const cacheTime = localStorage.getItem('cache_winners_time');
            const now = Date.now();

            if (cachedData && cacheTime && (now - cacheTime < 10 * 60 * 1000)) {
                renderWinners(JSON.parse(cachedData));
                return;
            }

            const wList = document.getElementById('winnersList');
            if (wList) wList.innerHTML = 'در حال دریافت آنلاین...';

            window.handleWinners = function(data) {
                if (data && Array.isArray(data)) {
                    localStorage.setItem('cache_winners', JSON.stringify(data));
                    localStorage.setItem('cache_winners_time', Date.now());
                    renderWinners(data);
                } else {
                    if (wList) wList.innerHTML = 'تاریخچه‌ای یافت نشد.';
                }
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_URL}?action=getWinnersHistory&callback=handleWinners&_=` + Date.now();
            document.body.appendChild(script);
        }

        function renderWinners(data) {
            const wList = document.getElementById('winnersList');
            if (!wList) return;

            if (!data || data.length === 0) {
                wList.innerHTML = 'تاریخچه‌ای یافت نشد.';
                return;
            }
            let html = '';
            data.forEach(w => {
                html += `
                    <div class="winner-card">
                        <div class="winner-title">📅 هفته: ${w.date}</div>
                        <div>🥇 نفر اول: <b>${w.top1}</b></div>
                        <div>🥈 نفر دوم: <b>${w.top2}</b></div>
                        <div>🥉 نفر سوم: <b>${w.top3}</b></div>
                        <div style="margin-top:5px; color:#38bdf8;">🎲 برندگان قرعه‌کشی:</div>
                        <div style="font-size:11px; padding-right:10px;">• ${w.lottery1}<br>• ${w.lottery2}<br>• ${w.lottery3}</div>
                    </div>`;
            });
            wList.innerHTML = html;
        }

        function openModal(id) { 
            const m = document.getElementById(id);
            if (m) m.style.display = 'flex'; 
        }
        function closeModal(id) { 
            const m = document.getElementById(id);
            if (m) m.style.display = 'none'; 
        }

        function shareInvite() {
            const txt = encodeURIComponent("همین الان گردونه رو بچرخون و سکه‌هاتو نقد کن! 🎯✨ چند تا شانس رایگان داری، از دستش نده ⚡️👇");
            window.open(`https://t.me/share/url?url=https://t.me/${BOT_USER}&text=${txt}`);
        }

        function buyPackage(p, pr) {
            closeModal('buyModal');
            const txt = encodeURIComponent(`درخواست خرید:\nنام: ${userName}\nشناسه: ${userId}\nبسته: ${p}\nقیمت: ${pr}`);
            window.open(`https://t.me/${SUPPORT_USER}?text=${txt}`);
        }
    </script>
