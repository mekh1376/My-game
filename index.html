<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گردونه شانس طلایی</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 15px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 15px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        h1 { font-size: 20px; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); margin-bottom: 5px; }
        
        .info-panel {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 15px;
            margin-top: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 14px;
        }
        .info-box { display: flex; flex-direction: column; align-items: center; }
        .info-title { font-size: 11px; color: #aaa; margin-bottom: 3px; }
        .info-value { font-weight: bold; color: #ffd700; }

        .timer-box {
            margin-top: 10px;
            font-size: 12px;
            color: #00d2d3;
            background: rgba(0, 210, 211, 0.1);
            padding: 6px;
            border-radius: 10px;
            display: none;
        }

        .wheel-container { position: relative; margin: 15px auto; width: 260px; height: 260px; }
        .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 25px solid #ff4757; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        #wheel { width: 260px; height: 260px; border-radius: 50%; border: 6px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.4); transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99); }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button { background: linear-gradient(45deg, #2ed573, #26af5f); color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4); transition: 0.3s; width: 100%; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #57606f; box-shadow: none; cursor: not-allowed; }
        
        .btn-buy { background: linear-gradient(45deg, #ff9f43, #ee5253); box-shadow: 0 5px 15px rgba(238, 82, 83, 0.4); }
        .btn-invite { background: linear-gradient(45deg, #0abde3, #10ac84); box-shadow: 0 5px 15px rgba(10, 189, 227, 0.4); }

        .result { margin-top: 10px; font-size: 15px; font-weight: bold; min-height: 22px; color: #2ed573; }
        .loading-status { font-size: 12px; color: #1e90ff; margin-bottom: 5px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #1b2735; border: 1px solid #ffd700; border-radius: 20px; padding: 20px; width: 100%; max-width: 320px; text-align: center;
        }
        .modal-title { font-size: 18px; color: #ffd700; margin-bottom: 15px; }
        .package-item {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .package-item:hover { background: rgba(255, 215, 0, 0.2); }
        .package-name { font-weight: bold; color: #fff; font-size: 14px; }
        .package-price { color: #2ed573; font-weight: bold; font-size: 14px; }
        .close-btn { background: #ff4757; margin-top: 10px; padding: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ گردونه شانس طلایی ✨</h1>
        <div id="loadingStatus" class="loading-status">در حال دریافت حساب کاربری... 🔄</div>
        
        <div class="info-panel">
            <div class="info-box">
                <span class="info-title">💰 موجودی</span>
                <span class="info-value"><span id="coinCount">0</span> سکه</span>
            </div>
            <div class="info-box">
                <span class="info-title">🎰 شانس باقی‌مانده</span>
                <span class="info-value"><span id="spinsLeft">0</span> بار</span>
            </div>
        </div>

        <div id="timerBox" class="timer-box">
            ⏳ دریافت شانس رایگان بعدی: <span id="countdown">--:--:--</span>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="260" height="260"></canvas>
        </div>
        
        <div class="result" id="resultText"></div>

        <div class="btn-group">
            <button id="spinBtn" onclick="spin()" disabled>بچرخون! 🎲</button>
            <button class="btn-invite" onclick="shareInviteLink()">👥 دعوت از دوستان (+۲ شانس)</button>
            <button class="btn-buy" onclick="openBuyModal()">🛒 خرید شانس بیشتر</button>
        </div>
    </div>

    <!-- پاپ‌آپ بسته‌های خرید -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <div class="modal-title">🛒 انتخاب بسته شانس</div>
            <div class="package-item" onclick="selectPackage('۳ شانس', '۱۵,۰۰۰ تومان')">
                <span class="package-name">🎯 ۳ شانس</span>
                <span class="package-price">۱۵,۰۰۰ تومان</span>
            </div>
            <div class="package-item" onclick="selectPackage('۵ شانس', '۲۳,۰۰۰ تومان')">
                <span class="package-name">🎯 ۵ شانس</span>
                <span class="package-price">۲۳,۰۰۰ تومان</span>
            </div>
            <div class="package-item" onclick="selectPackage('۷ شانس', '۳۰,۰۰۰ تومان')">
                <span class="package-name">🎯 ۷ شانس</span>
                <span class="package-price">۳۰,۰۰۰ تومان</span>
            </div>
            <div class="package-item" onclick="selectPackage('۱۰ شانس', '۴۲,۰۰۰ تومان')">
                <span class="package-name">🔥 ۱۰ شانس</span>
                <span class="package-price">۴۲,۰۰۰ تومان</span>
            </div>
            <button class="close-btn" onclick="closeBuyModal()">انصراف / بستن</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby54tOaKv8Fu1DiyLD66wuCtXRKgBoChREogCCmQEooNxeXNNXroGXa0XeWAqo6jLl_pg/exec';
        const BOT_USERNAME = 'LuckiyiyBot';
        const SUPPORT_USERNAME = 'luckiy_support';

        let telegramUser = null;
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                telegramUser = window.Telegram.WebApp.initDataUnsafe.user;
            }
        }

        const userId = telegramUser ? telegramUser.id : ('GUEST_' + Math.floor(Math.random()*1000));
        const userName = telegramUser ? ((telegramUser.first_name || '') + ' ' + (telegramUser.last_name || '')).trim() : 'مهمان';
        const userUsername = telegramUser ? (telegramUser.username ? '@' + telegramUser.username : 'ندارد') : 'guest';

        let coins = parseInt(localStorage.getItem('user_coins_' + userId)) || 0;
        let spins = parseInt(localStorage.getItem('user_spins_' + userId));
        if (isNaN(spins)) spins = 3;
        let lastSpinTime = parseInt(localStorage.getItem('user_lastSpin_' + userId)) || 0;

        function updateUI() {
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('spinsLeft').innerText = spins;
            
            localStorage.setItem('user_coins_' + userId, coins.toString());
            localStorage.setItem('user_spins_' + userId, spins.toString());
            localStorage.setItem('user_lastSpin_' + userId, lastSpinTime.toString());

            document.getElementById('spinBtn').disabled = spins <= 0;
            checkDailyReset();
        }

        function checkDailyReset() {
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;
            
            if (spins <= 0 && lastSpinTime > 0) {
                const diff = now - lastSpinTime;
                if (diff >= twentyFourHours) {
                    spins = 3;
                    lastSpinTime = 0;
                    document.getElementById('timerBox').style.display = 'none';
                    updateUI();
                    saveDataToGoogleSheet();
                } else {
                    document.getElementById('timerBox').style.display = 'block';
                    startCountdown(twentyFourHours - diff);
                }
            } else {
                document.getElementById('timerBox').style.display = 'none';
            }
        }

        let countdownInterval = null;
        function startCountdown(ms) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function tick() {
                if (ms <= 0) {
                    clearInterval(countdownInterval);
                    spins = 3;
                    lastSpinTime = 0;
                    updateUI();
                    saveDataToGoogleSheet();
                    return;
                }
                const h = Math.floor(ms / (1000 * 60 * 60));
                const m = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((ms % (1000 * 60)) / 1000);
                
                document.getElementById('countdown').innerText = 
                    `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                ms -= 1000;
            }
            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        function saveDataToGoogleSheet() {
            if (!GOOGLE_SCRIPT_URL) return;
            const payload = {
                userId: userId,
                name: userName,
                username: userUsername,
                coins: coins,
                spins: spins,
                lastSpinTime: lastSpinTime
            };
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('Sheet Save Error:', err));
        }

        function loadUserData() {
            if (!GOOGLE_SCRIPT_URL) return;

            fetch(`${GOOGLE_SCRIPT_URL}?userId=${userId}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.status === 'success') {
                        coins = parseInt(data.coins) || 0;
                        spins = parseInt(data.spins) || 0;
                        lastSpinTime = parseInt(data.lastSpinTime) || 0;
                    } else {
                        saveDataToGoogleSheet();
                    }
                    document.getElementById('loadingStatus').style.display = 'none';
                    updateUI();
                })
                .catch(err => {
                    console.log('Error loading data:', err);
                    document.getElementById('loadingStatus').style.display = 'none';
                    updateUI();
                });
        }

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        const items = [
            { text: '۲۰ سکه', val: 20 },
            { text: 'پوچ ❌', val: 0 },
            { text: '۵۰ سکه', val: 50 },
            { text: '۱۰ سکه', val: 10 },
            { text: '۱۰۰ سکه 🔥', val: 100 },
            { text: 'پوچ ❌', val: 0 },
            { text: '۲ برابر ⚡', val: '2x' },
            { text: '۵ سکه', val: 5 }
        ];
        
        const colors = ['#ff4757', '#2e86de', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#341f97', '#ff6b6b'];
        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            const numSegments = items.length;
            const anglePerSegment = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, 260, 260);

            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(130, 130);
                ctx.arc(130, 130, 130, i * anglePerSegment, (i + 1) * anglePerSegment);
                ctx.fill();
                
                ctx.save();
                ctx.translate(130, 130);
                ctx.rotate(i * anglePerSegment + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px Tahoma, Arial";
                ctx.fillText(items[i].text, 110, 4);
                ctx.restore();
            }
        }

        drawWheel();
        updateUI();
        loadUserData();

        function spin() {
            if (isSpinning || spins <= 0) return;
            isSpinning = true;
            spins--;
            
            if (spins === 0) {
                lastSpinTime = Date.now();
            }

            updateUI();

            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultText').innerText = 'در حال چرخش... 🎲';

            const extraDegrees = Math.floor(Math.random() * 360) + 1440;
            currentRotation += extraDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                
                const actualDegrees = currentRotation % 360;
                const segmentAngle = 360 / items.length;
                const index = Math.floor((360 - (actualDegrees % 360) + 270) % 360 / segmentAngle);
                const prize = items[index];

                document.getElementById('resultText').innerText = `🎉 برنده شدید: ${prize.text}`;

                if (typeof prize.val === 'number') {
                    coins += prize.val;
                } else if (prize.val === '2x') {
                    coins = coins > 0 ? coins * 2 : 20;
                }
                
                updateUI();
                saveDataToGoogleSheet();
            }, 4000);
        }

        function shareInviteLink() {
            const shareText = "فکر می‌کنی شانس کی بیشتره؟ 😉 بیا گردونه شانس رو بچرخون ببینم چقدر سکه می‌تونی برنده بشی! کلیک کن و شانس امروزت رو بگیر 🔥👇";
            const inviteUrl = `https://t.me/share/url?url=https://t.me/${BOT_USERNAME}&text=${encodeURIComponent(shareText)}`;
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(inviteUrl);
            } else {
                window.open(inviteUrl, '_blank');
            }
        }

        function openBuyModal() {
            document.getElementById('buyModal').style.display = 'flex';
        }

        function closeBuyModal() {
            document.getElementById('buyModal').style.display = 'none';
        }

        function selectPackage(title, price) {
            closeBuyModal();
            const message = `سلام، درخواست خرید بسته گردونه شانس دارم:%0A%0A👤 نام: ${userName}%0A🆔 آیدی عددی: ${userId}%0A📦 بسته: ${title}%0A💰 قیمت: ${price}`;
            const targetLink = `https://t.me/${SUPPORT_USERNAME}?text=${message}`;
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(targetLink);
            } else {
                window.open(targetLink, '_blank');
            }
        }
    </script>
</body>
</html>
